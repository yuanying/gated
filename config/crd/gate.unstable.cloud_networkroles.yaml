---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: networkroles.gate.unstable.cloud
spec:
  group: gate.unstable.cloud
  names:
    categories:
    - gated
    kind: NetworkRole
    listKind: NetworkRoleList
    plural: networkroles
    shortNames:
    - netrole
    singular: networkrole
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=="TargetResolved")].status
      name: Resolved
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          NetworkRole declares what may be done to a protected resource.

          A resource that no NetworkRole names is not protected at all: it is served
          without authentication (ADR 0002).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NetworkRoleSpec declares what a role permits.
            properties:
              rules:
                description: |-
                  rules are the grants this role carries. An empty list grants nothing,
                  which still marks the target as protected.
                items:
                  description: |-
                    NetworkRoleRule is one grant: a set of paths and the methods allowed on
                    them. Rules never deny; a request is allowed when any rule of any role bound
                    to the subject allows it (ADR 0002), so evaluation never depends on order.
                  properties:
                    methods:
                      description: methods allowed on those paths.
                      items:
                        description: HTTPMethod is an upper-case HTTP method name,
                          or "*" for every method.
                        enum:
                        - '*'
                        - GET
                        - HEAD
                        - POST
                        - PUT
                        - PATCH
                        - DELETE
                        - CONNECT
                        - OPTIONS
                        - TRACE
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                    paths:
                      description: |-
                        paths this rule covers, in the vocabulary of RBAC nonResourceURLs:
                        an exact path, a path ending in "*" for a prefix match, or "*" alone
                        for every path.
                      items:
                        maxLength: 1024
                        minLength: 1
                        pattern: ^(\*|/[^*]*\*?)$
                        type: string
                      minItems: 1
                      type: array
                      x-kubernetes-list-type: atomic
                  required:
                  - methods
                  - paths
                  type: object
                maxItems: 128
                type: array
                x-kubernetes-list-type: atomic
              targetRef:
                description: targetRef names the resource this role protects.
                properties:
                  group:
                    default: networking.k8s.io
                    description: |-
                      group is the API group of the target. Only the Ingress group is
                      supported today.
                    enum:
                    - networking.k8s.io
                    type: string
                  kind:
                    default: Ingress
                    description: kind is the kind of the target. Only Ingress is supported
                      today.
                    enum:
                    - Ingress
                    type: string
                  name:
                    description: name of the target.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                    type: string
                  namespace:
                    description: |-
                      namespace of the target. Defaults to the namespace of the NetworkRole
                      itself.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                required:
                - name
                type: object
            required:
            - targetRef
            type: object
          status:
            description: NetworkRoleStatus reports what the role currently resolves
              to.
            properties:
              conditions:
                description: |-
                  conditions of the role. TargetResolved is set to False when
                  spec.targetRef names something that does not exist.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the generation of the spec this status was
                  computed from.
                format: int64
                type: integer
              resolvedTargets:
                description: resolvedTargets are the targets spec.targetRef was resolved
                  to.
                items:
                  description: |-
                    ResolvedTarget is a target that was found, along with the hostnames it
                    serves. Recording the hosts here is what makes a fail-open hole visible: a
                    role whose target never resolves shows up as an empty list and a false
                    TargetResolved condition instead of silently protecting nothing.
                  properties:
                    hosts:
                      description: hosts the resolved target serves.
                      items:
                        type: string
                      type: array
                      x-kubernetes-list-type: atomic
                    name:
                      description: name of the resolved target.
                      type: string
                    namespace:
                      description: namespace of the resolved target.
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
