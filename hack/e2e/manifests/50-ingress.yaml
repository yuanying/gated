---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # The central authentication host needs a certificate like any other host,
  # so it needs an Ingress. What is behind it is never reached: the login
  # paths are answered before routing (ADR 0020).
  name: auth
  namespace: gated-e2e
spec:
  ingressClassName: gated
  tls:
    - hosts:
        - auth.example.com
      secretName: auth-tls
  rules:
    - host: auth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
