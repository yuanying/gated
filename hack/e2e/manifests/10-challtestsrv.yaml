# The DNS server the ACME test server resolves names through.
#
# Every name resolves to gated's cluster IP, which is what lets a certificate
# be ordered for a hostname nobody owns: the validation request goes to gated,
# which is the point of the exercise. Its own challenge responders are turned
# off — answering HTTP-01 is gated's job (ADR 0015), and a second responder
# would hide a gated that had stopped doing it.
apiVersion: v1
kind: Service
metadata:
  name: challtestsrv
  namespace: gated-system
spec:
  # Fixed, because Pebble is given this address on its command line.
  clusterIP: 10.96.100.11
  selector:
    app.kubernetes.io/name: challtestsrv
  ports:
    - name: dns-udp
      port: 8053
      targetPort: 8053
      protocol: UDP
    - name: dns-tcp
      port: 8053
      targetPort: 8053
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: challtestsrv
  namespace: gated-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: challtestsrv
  template:
    metadata:
      labels:
        app.kubernetes.io/name: challtestsrv
    spec:
      containers:
        - name: challtestsrv
          image: gated-challtestsrv:e2e
          imagePullPolicy: IfNotPresent
          args:
            - -http01=
            - -https01=
            - -tlsalpn01=
            - -doh=
            - -defaultIPv4=10.96.100.10
            # IPv4 only, so a validation cannot arrive over an address
            # nothing is listening on.
            - -defaultIPv6=
          ports:
            - containerPort: 8053
              protocol: UDP
            - containerPort: 8053
              protocol: TCP
