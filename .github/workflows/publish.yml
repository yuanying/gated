# Publishing the gated image
#
# A cluster pulls what this workflow pushes, so it is built from a commit that
# is in this repository rather than from whatever a laptop happened to hold
# (ADR 0029). One rule decides the tag: the image is named after the git ref
# it was built from. A push to main publishes `main`, pushing a version tag
# publishes that tag, and a deployment pins the version tag — `main` keeps
# moving and is not something to pin. `latest` is not published at all.
#
# release.yml (ADR 0036, ADR 0038) calls this with the version it is about to
# tag and the commit it is about to tag. A tag pushed with the run's token
# starts no workflow, so the image for that version is pushed here first, from
# that commit, and the tag only follows once the image exists. The name is
# still the ref's: it is the one that commit is about to get.
#
# A push to main also deletes the images it leaves untagged (ADR 0037).
#
# This is the one workflow here that writes something and the one that cannot
# run for a pull request that has not been merged. Both are why it is a file of its own: in ci.yml the
# read-only permission at the top says the whole file writes nothing, and that
# sentence is worth keeping true.
name: publish

# Push events, and the call from release.yml. A pull request from a fork
# raises no push event in this repository, so no branch a fork wrote ever
# reaches the job below, which holds a token that can write packages. A push
# inside a fork runs in that fork, against that fork's packages. release.yml
# runs on a schedule or by hand, only for main, or once a pull request from a
# branch of this repository is merged, and then builds the merge commit on
# main: never what a pull request holds before it is merged. The
# `no-live-layer` job in ci.yml keeps the trigger that would change this out
# of every workflow.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      version:
        description: The version tag release.yml is about to push (vX.Y.Z).
        type: string
        required: true
      sha:
        description: The commit release.yml is about to tag, which the image is built from.
        type: string
        required: true

permissions:
  contents: read

# Two pushes to main can be in flight at once, and the later one should win
# the `main` tag. Cancelling is per ref, so a version tag is never cancelled
# by a push to main. A call from release.yml runs for main as well, and is
# keyed on its version so that a push to main does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The ref this image is named after: the pushed one, or the version tag
  # release.yml is about to push.
  TAG: ${{ inputs.version || github.ref_name }}
  # The commit it is built from: the pushed one, or the one release.yml is
  # about to tag. For a merged pull request that is its merge commit on main,
  # which github.sha is not.
  REVISION: ${{ inputs.sha || github.sha }}

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Widened here and not at the top of the file, so that the one job able to
    # write a package is the one that says so (ADR 0029).
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}

      # Buildx is what makes the platform a list rather than whatever the
      # runner happens to be. Only linux/amd64 is built: every arm64 node gated
      # is being deployed to is unschedulable, and emulating one costs build
      # minutes nobody is waiting on. Adding a platform is adding an entry —
      # the Dockerfile already takes its target from the builder.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The token GitHub mints for this run. It is not a stored secret: it
      # exists for the length of the job and the permissions above are its
      # ceiling (ADR 0029). The same value is readable through the github
      # context, which the check in ci.yml does not look at — reaching for it
      # there would be a way around a check, so it is written as a secret and
      # allowed by name.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          # Left off, the push carries a provenance attestation, which turns a
          # single-platform image into an index with an entry no runtime asks
          # for. Whether to sign and attest is a decision this repository has
          # not made; when it does, it goes in an ADR first.
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.REVISION }}
            org.opencontainers.image.version=${{ env.TAG }}

      # What was pushed, what it hashes to and where to look at it, on the
      # run's own page. Reading it should not mean opening a build log.
      - name: Say what was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "### ${IMAGE}:${TAG}"
            echo
            echo "- digest: \`${DIGEST}\`"
            echo "- built from: ${SERVER}/${REPO}/commit/${REVISION}"
            echo "- package: ${SERVER}/users/${OWNER}/packages/container/package/gated"
          } >> "$GITHUB_STEP_SUMMARY"

  # Every push to main moves `main` onto a new image and leaves the one it
  # pointed at untagged. Nothing asks for those by digest — a deployment pins
  # a version tag — so they are deleted once the new one is up (ADR 0037).
  # Tagged images are never touched. The action walks image indexes and keeps
  # the platform manifests of a tagged one, so it stays safe if a platform or
  # an attestation is added to the build above.
  #
  # Only a push to main runs it. A version tag never untags anything, and a
  # call from release.yml must not be held up by it: a cleanup that fails or
  # is cancelled there would fail the call and leave the version untagged.
  # Pushes to main share one concurrency group above, so two of these never
  # run against the package at once, which the action is not safe for.
  cleanup:
    name: cleanup
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      # Deletes every untagged version of ghcr.io/yuanying/gated, and logs the
      # id of each one; a deleted version can be restored through the API by
      # that id. Named as a secret for the same reason as the login above.
      - uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: gated
          delete-untagged: true
